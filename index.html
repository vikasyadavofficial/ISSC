<style>
:root{--bg:#d9d9d9;--fg:#1a1a1a;--card:#e6e6e6;--pop:#ececec;--pri:#171717;--prifg:#f4f4f4;--muted:#555;--border:#b3b3b3;--input:#a3a3a3;--ring:#4d4d4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#e8e8e8;--card:#222;--pop:#2a2a2a;--pri:#ededed;--prifg:#161616;--muted:#a0a0a0;--border:#3d3d3d;--input:#555;--ring:#aaa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--fg:#e8e8e8;--card:#222;--pop:#2a2a2a;--pri:#ededed;--prifg:#161616;--muted:#a0a0a0;--border:#3d3d3d;--input:#555;--ring:#aaa;color-scheme:dark}
*{box-sizing:border-box;border-color:var(--border)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;margin:0}
a{color:inherit}img{max-width:100%;display:block}
.wrap{max-width:80rem;margin:0 auto;padding:0 1.5rem}
@media(min-width:768px){.wrap{padding:0 3rem}}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding-top:1.5rem;padding-bottom:1.5rem}
.brand{font-family:Manrope,sans-serif;font-size:1.35rem;letter-spacing:-.02em;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:1.25rem;font-size:.9rem}
nav a{text-decoration:none;transition:opacity .2s}nav a:hover{opacity:.6}nav a.on{text-decoration:underline;text-underline-offset:4px}
footer{margin-top:6rem;border-top:1px solid var(--border)}
footer .wrap{display:flex;flex-direction:column;gap:.5rem;padding-top:2.5rem;padding-bottom:2.5rem}
@media(min-width:768px){footer .wrap{flex-direction:row;justify-content:space-between}}
footer .fb{font-family:Manrope,sans-serif;font-size:1.1rem}footer a{font-size:.9rem;color:var(--muted);text-decoration:none}
.grid2{display:grid;gap:3rem;align-items:center}@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr}}
.sec{padding-top:4rem;padding-bottom:4rem}
.h-xl{font-size:clamp(2.6rem,7vw,4.5rem);font-weight:700;font-style:italic;line-height:1.02;letter-spacing:-.025em}
.btn{display:inline-flex;border:0;border-radius:999px;background:var(--pri);color:var(--prifg);padding:1rem 3.5rem;font:inherit;font-size:.8rem;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.85}.btn.sm{padding:.75rem 2rem;font-size:.75rem}
.muted{color:var(--muted)}
.cards{display:grid;gap:2rem;margin-top:3rem}@media(min-width:768px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;background:var(--card)}.card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.card .b{display:flex;flex:1;flex-direction:column;padding:1.5rem}.card p{flex:1;font-size:.9rem;margin:.75rem 0 1.5rem}
.fact{display:grid;gap:2rem;border-top:1px solid var(--border);padding:2rem 0;margin-top:1.5rem}@media(min-width:768px){.fact{grid-template-columns:1fr 1fr}}
.verdict{display:inline-block;margin-top:1rem;border-radius:999px;background:var(--pri);color:var(--prifg);padding:.25rem 1rem;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.fact ul{list-style:none;padding:0;margin:1.25rem 0 0;display:grid;gap:.75rem;font-size:.9rem}.fact li{border-left:2px solid var(--fg);padding-left:1rem}
form .row{display:grid;gap:1rem}@media(min-width:640px){form .row{grid-template-columns:1fr 1fr}}
form{display:grid;gap:1rem}label{font-size:.9rem;display:block}
input:not([type=checkbox]),textarea{width:100%;margin-top:.25rem;border-radius:6px;border:1px solid var(--input);background:var(--pop);color:var(--fg);padding:.5rem .75rem;font:inherit;font-size:.9rem;outline:none}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--ring)}label.chk{display:flex;gap:.5rem;align-items:center}
.ph h1{font-size:clamp(3rem,7vw,4.5rem);font-style:italic;letter-spacing:-.02em}
.art{max-width:48rem;margin:0 auto;padding:5rem 1.5rem}
.art h1{font-size:clamp(2rem,5vw,3rem);font-weight:600;line-height:1.15;letter-spacing:-.02em}
.art-body{display:grid;gap:1.25rem;margin-top:2.5rem;line-height:1.7}.art-body h2{font-size:1.5rem;font-weight:700;padding-top:1.5rem}.art-body p{margin:0}
.al{border-bottom:1px solid var(--border);padding:2.5rem 0}.al:first-child{padding-top:0}.al h2{font-size:clamp(1.9rem,4vw,2.5rem);font-weight:600;letter-spacing:-.02em;margin-top:.5rem}
.vb{display:grid;gap:2rem;font-size:.9rem;font-weight:600;font-style:italic;line-height:1.7}.vb p{margin:0}
.stats{display:grid;gap:2.5rem 3rem;max-width:48rem}@media(min-width:640px){.stats{grid-template-columns:1fr 1fr}}
.toggle{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;padding:.5rem .9rem;font:inherit;font-size:.8rem;cursor:pointer}

::selection{background:var(--pri);color:var(--prifg)}
.skip{position:absolute;left:1rem;top:-4rem;z-index:20;background:var(--pri);color:var(--prifg);padding:.6rem 1rem;border-radius:6px;text-decoration:none;transition:top .2s}.skip:focus{top:calc(.75rem + env(safe-area-inset-top,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
header .wrap{padding-top:1rem;padding-bottom:1rem}
.brand{font-weight:800;font-size:1.15rem}@media(min-width:768px){.brand{font-size:1.35rem}}
nav a{position:relative;padding:.25rem 0}nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
nav a:hover{opacity:1}nav a:hover::after,nav a[aria-current=page]::after{transform:scaleX(1)}nav a.on{text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ring);outline-offset:3px;border-radius:4px}
main:focus{outline:none}
.btn{letter-spacing:.14em;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .2s,box-shadow .2s,opacity .2s}
.btn:hover{opacity:1;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.22)}.btn:active{transform:none}
.card{border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.card img{transition:transform .6s ease}.card:hover>img{transform:scale(1.04)}.card{overflow:hidden}
#what img,.fact>img,.grid2>img[alt*=Andromeda]{border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.grid2>img[alt="ISSC emblem"]{box-shadow:0 18px 50px rgba(0,0,0,.28);border:1px solid var(--border)}
.fact li{background:color-mix(in srgb,var(--card) 70%,transparent);padding:.75rem 1rem;border-radius:0 8px 8px 0}
.verdict{box-shadow:0 2px 6px rgba(0,0,0,.2)}
.al{transition:padding-left .25s}.al:hover{padding-left:.5rem}
.al h2 a{background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .3s}.al h2 a:hover{background-size:100% 2px}
.art-body p{font-size:1.05rem}.art-body h2{border-top:1px solid var(--border);margin-top:1rem}
input:not([type=checkbox]),textarea{transition:border-color .2s,box-shadow .2s}input:not([type=checkbox]):hover,textarea:hover{border-color:var(--ring)}
input:user-invalid,textarea:user-invalid{border-color:#b3261e}
input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--pri)}
textarea{resize:vertical;min-height:6rem}
.stats p:last-child{font-family:Manrope,sans-serif;font-size:2rem!important;font-weight:800}
.stats>div{border-top:2px solid var(--fg);padding-top:1rem}
.vb{font-size:.95rem}
footer{background:color-mix(in srgb,var(--card) 60%,transparent)}footer a:hover{color:var(--fg);text-decoration:underline}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}

#what{scroll-margin-top:6rem}
.art-svg{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.2);background:var(--card)}
.menu{display:none;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;padding:.45rem 1rem;font:inherit;font-size:.85rem;cursor:pointer}
@media(max-width:767px){.menu{display:inline-flex}nav{display:none;width:100%;flex-direction:column;gap:0}nav.open{display:flex}nav a{padding:.7rem 0;border-top:1px solid var(--border)}nav a::after{display:none}nav a.on{font-weight:700}}
.toggle.top{right:auto;left:1rem}
@media(max-width:767px){header .wrap{flex-wrap:wrap;align-items:center}.brand{flex:1 1 0;min-width:0}.menu{flex:none}}
.toggle:hover{background:var(--pop)}

@media print{header,.toggle,.skip{display:none}body{background:#fff;color:#000}}

.vsec{padding-top:4rem}.vsec h2.vh{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:600;letter-spacing:-.02em;margin:0}
.vgrid{display:grid;gap:2rem;margin-top:2rem}@media(min-width:768px){.vgrid.long{grid-template-columns:repeat(2,1fr)}.vgrid.short{grid-template-columns:repeat(3,1fr)}}@media(min-width:1100px){.vgrid.short{grid-template-columns:repeat(4,1fr)}}
.vcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.vframe{position:relative;width:100%;background:#000}.vframe.l{aspect-ratio:16/9}.vframe.s{aspect-ratio:9/16}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcard .b{padding:1.1rem 1.25rem 1.25rem;display:grid;gap:.5rem}.vcard h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.3}
.vcard a{font-size:.85rem;text-underline-offset:4px}
.vfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:700}.vfb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}.vfb span{position:relative;background:rgba(0,0,0,.75);padding:.6rem 1.2rem;border-radius:999px;font-size:.9rem}</style></head>

guzS3LPC3fJm0lNSXd9mYrbHNpXTW3tUZarSQ1OOak6V/wAHbFJqdonJFKml2lf8Dr0Sfx8hmhLDmljkqcXRHB3+tRS1UGly4cnmo6z3Hnv/AFqnCLXZhOLXBoQ32YsxZdZVQ1NlMkii93fA3CLBGiSomoxeB3wxxU4dxs3B8ImtYUcriv0m8NTGS44a+hzx5sh9k/OjreqT4d19jDJk3XwZydRsT7GYC2G5+BsleTaKS4KsQn2AcLwmLbB9xr7CKRBDhG6TDZ7Ox0qF0uBKhOLRNtM1u4omRoT8WS8s0jqZw6M0FLkmDeGqaldI1lrFNJNHCUhivQx58dUm190Q4xm+Gjkt2EW93YHR+WuQ/wAuovmzJTlu7ZcZy3PlgOWnvrkxlinF9HXGTpcms+ewPOqVcFqco+DeCVsramnaA53ltcxSE3F+Ebyiq6MpRVdAQtvuaRkoyu7MZkAdjnzdCeTn2OaDfPJVv3Ji62eV0Cye5l4E+yjdTV9j82c5pBuwNHJi3K7onwC6ArdT5Q1JNexnIbXAFqVeQ3OuyPBPkDRZAMvAAf/Z"}, "articles": [{"slug": "increasing-superstitions-in-india", "title": "Increasing Superstitions in India", "date": "23 October 2026", "blocks": [{"h": "Change in Culture"}, {"p": "We Indians come from a culture where questioning was given immense importance. There was a culture of discussion and debate in early times, both in Indian philosophy and in the Upanishads, where most of the teachings are given in the form of communication between a student (shishya) and a teacher (guru). But now the time has changed. We have forgotten our own roots and culture. We accept what is said to us by our elders without questioning it or even thinking whether it is logical or not. We just accept it out of fear because everyone else accepts it, and this chain has created a wide range of superstitions among Indians. And now, many of us are just believing in some illogical things on the basis of religion."}, {"h": "Decreasing scientific temperament in modern day"}, {"p": "The overall scientific temperament of Indians has increased over time since independence. However, in recent times, it has also been observed that there is a significant decrease in scientific temperament due to misinformation and pseudoscience spreading on social media. A study conducted in 2025 by Dhruv Raina, titled “Changing Agendas, New Challenges: The Contemporary Salience of Scientific Temper in India?”, says that today one of the biggest threats to science is the calculated production and spread of misinformation."}, {"p": "The access to social media has now given a platform to people performing superstitious activities, and a large population is also following them because of innocence."}, {"h": "Educated people can also be superstitious"}, {"p": "Have you seen many educated people who may have done a BSc and MSc in science or even have a PhD, but still believe in astrology and wear different types of rings because they believe they have some kind of misfortune on them due to some planets which are so far away from them that they can only see them in the form of stars?"}, {"p": "A major study in the year 2007–2008 questioned around 1,100 scientists from 130 different Indian universities, and the results were surprising. Around 40% approved, in some form, of taking a space vehicle's replica to a temple for blessings before a launch, and around 7 percent believed in ghosts too."}, {"p": "However, we have to also understand that they are not doing anything illegal and have complete rights to do all these things. Every person in a democratic country has the right to live freely, free in their thoughts and actions too. But we have to understand that when a large educated population starts becoming superstitious, where will society go? They will start to believe more in mystery rather than facts and action, and the most dangerous thing is transferring all this to the next generation too."}, {"h": "Reason for increasing superstitions"}, {"p": "The question arises: why do superstitions still persist when 4 out of every 5 Indians above the age of 7 are now literate? Still, we are not seeing a significant decrease in superstitions. So, to understand this, we have to go to the root cause from where these superstitions are arising, and the straightforward answer is that most of the superstitions in India are directly or indirectly related to religions. And I am not talking about a particular religion, but all have this tendency. All the astrology, distribution of different rings and other materials to prevent misfortune is distributed in the name of religion."}, {"p": "The important thing is, because of all these things, it is not correct that we boycott any religion. Every religion comes with two aspects: its teachings and its predefined notions, which often don’t have logic. However, exceptions are there. If I talk about my own religion, which is Hinduism, it is no doubt one of the peaceful and oldest religions. It has a huge amount of good things to offer. Even some of the world’s finest philosophies are mentioned in some form in the religion. These are the good aspects of a religion, which are called teachings, and it is the same thing that we have to learn from it and implement in our own lives."}, {"p": "But it also has an opposite part, which we can’t say was the part of the religion, but over hundreds of years, a large population has associated certain practices with the religion which are illogical, like all the astrology stuff in India is sold in the name of Hinduism, and people often take pride in counting these superstitious activities as a part of Hinduism."}, {"p": "I think all the Hindus should themselves try to throw off all the outdated practices which are without logic and often don’t resonate with science, and we should move towards the actual teachings which are important and are given in the Upanishads, Gita and Vedas. And I have given you the example of Hinduism only because I know that religion, as it is my own religion. Similarly, many superstitions prevail in Islam and Christianity too, and eliminating them is the job of people belonging to that particular community. We have to first clean our own home rather than pointing at the trash in someone else’s."}, {"h": "The innocence of a common Indian"}, {"p": "By far, I have seen my country’s people are emotional and have very deep relationships among their own family members, and often these relationships and emotional innocence are exploited in the name of superstition only. This is mainly done by some people who claim to cure someone by some kind of miracle or religious practice. Let me give you an example, then we will move further."}, {"p": "2024 Haridwar case: A child from Delhi suffering from blood cancer was taken to a particular place at Haridwar, and according to police reports, doctors had already said that the child’s cancer was advanced and couldn’t be cured. But the parents only wanted to save their child at any cost. And now what I am going to tell you will by far show you the most evil face of superstitions. They submerged the child into the Ganga multiple times with the belief that his cancer could be cured, and at last, the child died."}, {"p": "This clearly shows how much harm superstitions in your brain can do, and this is only a single incident. There are many people who show different kinds of magic and claim to treat cancer and other kinds of incurable diseases, and the innocence of a common Indian, often having deep love for his family, falls into this trap as he wants the cure at any cost, if not from a doctor, then from these so-called people."}, {"h": "How can we end superstitions"}, {"p": "The superstition can only be ended through questioning. The moment you start to question your beliefs, your notions, superstitions start to fall. Sometimes, it might seem uncomfortable if you have lived in the environment for so long and try to break so-called notions. You might have an argument with your elders regarding this, and they may say, “You know more than our ancestors?” Then simply, yes, our ancestors were not having mobile phones, but we have them. They were not having the kind of clothes we have, so yes, we change with nature, and it is important."}]}, {"slug": "the-barriers-between-us-and-extraterrestrial-life", "title": "The Barriers Between Us and Extraterrestrial Life", "date": "23 October 2026", "blocks": [{"p": "Sometimes I encounter a great sense of fear and loneliness when I realize that till now we are alone in this universe according to current scientific findings. Some people don't realize this because they never think about it. We all are so busy in our own life that we never think about the extraterrestrial life which might be there in some other corner of the universe. They also have a sun, a planet and are living peacefully in their own cities. However, till now we don't know whether there is life on some other planet or not, or the universe itself is creating multiple barriers to stop different life forms meeting with each other."}, {"h": "THE PALE BLUE DOT"}, {"h": "EARTH About 3.7 billion miles away | Voyager 1"}, {"p": "What you are seeing in the image above is our planet, and we call it Earth. We live here. Our family, friends, relatives, anger, ego - all reside on this small pale blue dot. We often try to communicate millions of light-years away from this small planet by using different types of electromagnetic waves, but still, we have not found a single piece of evidence supporting life till now. So, what's the problem? Why are we not able to communicate with other dots like our Earth in this universe?"}, {"h": "1. Light and communication have a fixed Speed"}, {"p": "We were told a fact since we were in middle school: that light always propagates at a fixed speed, which is approximately equal to 300,000 kilometers per second. This sounds quite fast, but when we see the scale of our cosmos, you will feel that it is very slow."}, {"p": "Let me give you an example. The size of our observable universe is about 93 billion light-years, which means if light had to travel through the observable universe, it would take 93 billion years, and this time span is so enormous that our Earth is roughly only 4.5 billion years old."}, {"p": "And not only light, but any type of electromagnetic wave has to move at this fixed speed. In space, we only communicate through electromagnetic waves, so the speed of our communication is also fixed."}, {"p": "Even the speed of gravity is fixed according to the general theory of relativity. Even gravity can't move faster than light."}, {"p": "Let me give you an example. Assume that you are on Earth and suddenly the Sun disappears. It will take you about 8 minutes to realize this because the Sun is around 8 light-minutes away. But the interesting thing is that the change in the orbit of Earth due to the Sun's disappearance will also take about 8 minutes to happen, as gravity can't show its effects at a speed greater than the speed of light."}, {"p": "In conclusion, till now, according to our current understanding, nothing travels faster than light in our universe."}, {"p": "The first problem starts from here: the problem of communication. We can't communicate at a speed greater than the speed of light. So, if there is an alien species on some planet which is a million light-years away, our signal will take a million years to reach there. During this time, the signal will also lose its strength due to some other phenomena that we are not going to discuss here."}, {"p": "And if we are lucky and the other species successfully detects our signal and sends a reply back to us, it will take another million years for the reply to reach us. So, it becomes a continuous process of 2 million years, and until then, we don't know whether the same species that sent the signal will still survive or not."}, {"p": "So, the speed of light itself becomes a communication barrier in our huge universe."}, {"h": "2. Building the Same Instruments We Have"}, {"p": "We all know that if we have to communicate with our friend, we use our mobile phone. But the important point is that both people should have devices with the proper ability to communicate. If one has a mobile phone and the other has some other instrument, like a radio, communication can't necessarily be established."}, {"p": "So, when we send our signals in the form of electromagnetic waves, it is also important that the other life form with which we are trying to communicate also has the proper instrument to detect them. Otherwise, the signal may reach that planet, but still it will go to waste."}, {"p": "We know that humans are roughly 300,000 years old and started to communicate in space using different technologies only around 100 to 120 years ago. So, there is a huge possibility that life forms may exist, but they don't have well-developed technology to detect our signals or to interpret them."}, {"p": "And it's also important to note that the fundamental laws of physics do not change throughout the universe. Whether you are in any corner of the universe, the same fundamental physical laws should work. So, if an intelligent species is there, they would also be dealing with the same fundamental laws of physics, and there are high chances that they might develop machines similar to us. However, there can be huge differences, but the fundamental principles would be the same."}, {"h": "3. Understand the language of other life forms"}, {"p": "If you are an American and have fluency in English and try to communicate with a Chinese person, you might not be able to communicate due to a language barrier. A similar barrier also exists in extraterrestrial communication."}, {"p": "If we receive a signal, then the most important part will be to correctly interpret that artificial signal, if it is actually artificial. An example that has been recorded in history is the Wow! signal, which was a 72-second narrow-band radio burst detected on August 15, 1977, by Ohio State University's Big Ear telescope. However, recent studies have suggested that it may have been a natural astrophysical event - specifically, a flare from a highly magnetized star, possibly a magnetar, interacting with a cold cloud of interstellar hydrogen, rather than an alien signal. However, this explanation is still a hypothesis and the true origin of the Wow! signal remains unknown."}, {"p": "It is true that it is not easy for humans to interpret an interstellar signal coming from an artificial source. However, we have tried some initiatives like Voyager and New Horizons with the intent that someday they may reach some other life forms. But the problem of language also persists in these missions. When you look at the Voyager 1 Golden Record, you yourself might not be able to interpret it. I don't know how aliens will do this if they find it."}, {"h": "4. The Fermi Paradox"}, {"p": "I think it would be an injustice to the article to end it without discussing the Fermi Paradox, which states: The universe seems like it should have plenty of opportunities for intelligent life to exist, so why haven't we seen any evidence of extraterrestrial civilizations?"}, {"p": "And what you have read above in points 1 to 3 was a discussion on this paradox only - the barriers between us and extraterrestrial life."}, {"p": "I hope that one day we will definitely find life forms on some other planet."}, {"h": "THANKS FOR READING"}]}]};const I=D.imgs,A=D.articles;
